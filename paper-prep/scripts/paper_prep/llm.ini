; paper-prep LLM 配置
;
; 此文件只存「端点与模型」这类无敏感信息的默认值,跟随版本库。
; 密钥不在本文件,从环境变量读(见 [llm] api_key_env 指定的名字)。
;
; 配置优先级(高 → 低):
;   1. --llm-model CLI
;   2. LLM_API_KEY / LLM_BASE_URL / LLM_MODEL_NAME  环境变量(与 litrev-extract 同名)
;   3. 本 ini 的默认值
;   4. OPENAI_API_KEY / OPENAI_BASE_URL  兼容兜底(仅非 Claude 会话、用户自设全局时)
;   5. 全无 → WARN 并禁用 LLM 通道,降级为仅余弦相似度

[llm]
; 从哪个环境变量读密钥(填变量名,不是值)
api_key_env = LLM_API_KEY
; 默认端点(litrev-extract 用的本地代理,与 metadata 提取同一接口)
base_url = http://localhost:37183/v1
; 默认模型
model = deepseek-v4-flash
; 单次调用超时(秒)
timeout = 15
