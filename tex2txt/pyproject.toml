[project]
name = "tex2txt"
version = "0.1.0"
description = "LaTeX to plain text converter with input/include expansion"
requires-python = ">=3.10"

[project.scripts]
tex2txt = "tex2txt.cli:main"
tex2txt-gui = "tex2txt.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tex2txt"]

[tool.uv]
package = true

[dependency-groups]
dev = []